<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="url(#bgGrad)"/>
  
  <!-- Outer Frame -->
  <rect x="20" y="20" width="920" height="440" rx="12" fill="none" stroke="#1f2937" stroke-width="2"/>

  <!-- Title -->
  <text x="480" y="55" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold" fill="#f3f4f6" text-anchor="middle">
    AI-Based Phishing Website Detection System — Two-Model Architecture
  </text>
  <text x="480" y="78" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">
    From Offline Multi-Modal Benchmarking to Real-Time Browser Extension Deployment
  </text>

  <!-- Box 1: Dataset & Ingestion -->
  <g transform="translate(40, 110)">
    <rect width="180" height="130" rx="8" fill="url(#blueCard)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#60a5fa" text-anchor="middle">UCI Phishing Dataset</text>
    <text x="90" y="55" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">11,055 Samples</text>
    <text x="90" y="75" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">30 Categorical Features</text>
    <text x="90" y="95" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Stratified Split (80/20)</text>
    <rect x="20" y="105" width="140" height="16" rx="4" fill="#1e3a8a"/>
    <text x="90" y="117" font-family="sans-serif" font-size="9" font-weight="bold" fill="#93c5fd" text-anchor="middle">Zero Missing Values</text>
  </g>

  <!-- Arrow 1 to 2A and 2B -->
  <path d="M 220 175 L 260 175 L 260 145 L 280 145" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="280,141 290,145 280,149" fill="#3b82f6"/>

  <path d="M 220 175 L 260 175 L 260 300 L 280 300" fill="none" stroke="#10b981" stroke-width="2"/>
  <polygon points="280,296 290,300 280,304" fill="#10b981"/>

  <!-- Box 2A: Model A (Upper Track) -->
  <g transform="translate(290, 90)">
    <rect width="210" height="110" rx="8" fill="url(#blueCard)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="105" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a5b4fc" text-anchor="middle">Track A: Full Benchmark</text>
    <text x="105" y="45" font-family="sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">All 30 Features (DOM, SSL, DNS)</text>
    <text x="105" y="65" font-family="sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">Random Forest, DT, CNB, GNB, LR</text>
    <rect x="20" y="78" width="170" height="20" rx="4" fill="#312e81"/>
    <text x="105" y="92" font-family="sans-serif" font-size="10" font-weight="bold" fill="#c7d2fe" text-anchor="middle">RF Accuracy: 97.60% | AUC: 0.996</text>
  </g>

  <!-- Box 2B: Model B (Lower Track) -->
  <g transform="translate(290, 245)">
    <rect width="210" height="110" rx="8" fill="url(#blueCard)" stroke="#10b981" stroke-width="1.5"/>
    <text x="105" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">Track B: Real-Time URL Model</text>
    <text x="105" y="45" font-family="sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">8 Address-Bar Features Only</text>
    <text x="105" y="65" font-family="sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">Decision Tree, RF, CNB, GNB, LR</text>
    <rect x="20" y="78" width="170" height="20" rx="4" fill="#064e3b"/>
    <text x="105" y="92" font-family="sans-serif" font-size="10" font-weight="bold" fill="#6ee7b7" text-anchor="middle">DT Accuracy: 73.13% | Rec: 76.63%</text>
  </g>

  <!-- Arrow from Model B to Export -->
  <path d="M 500 300 L 540 300" fill="none" stroke="#10b981" stroke-width="2"/>
  <polygon points="540,296 550,300 540,304" fill="#10b981"/>

  <!-- Box 3: Model Serializer -->
  <g transform="translate(550, 245)">
    <rect width="160" height="110" rx="8" fill="url(#blueCard)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="80" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">Model Serializer</text>
    <text x="80" y="45" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Scikit-learn Tree to JSON</text>
    <text x="80" y="65" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">extension/model.json</text>
    <text x="80" y="80" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">extension/model_data.js</text>
    <rect x="15" y="88" width="130" height="16" rx="4" fill="#78350f"/>
    <text x="80" y="100" font-family="sans-serif" font-size="9" font-weight="bold" fill="#fde68a" text-anchor="middle">31.4 KB Compact Size</text>
  </g>

  <!-- Arrow from Serializer to Chrome Extension -->
  <path d="M 710 300 L 750 300" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="750,296 760,300 750,304" fill="#f59e0b"/>

  <!-- Box 4: Chrome Extension -->
  <g transform="translate(760, 150)">
    <rect width="160" height="205" rx="8" fill="url(#blueCard)" stroke="#10b981" stroke-width="2"/>
    <text x="80" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">Chrome Extension (MV3)</text>
    <text x="80" y="45" font-family="sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle">PhishShield AI</text>
    <line x1="15" y1="55" x2="145" y2="55" stroke="#374151"/>
    
    <text x="80" y="73" font-family="sans-serif" font-size="9.5" fill="#e2e8f0" text-anchor="middle">1. Active Tab URL</text>
    <text x="80" y="93" font-family="sans-serif" font-size="9.5" fill="#e2e8f0" text-anchor="middle">2. JS Feature Extractor</text>
    <text x="80" y="113" font-family="sans-serif" font-size="9.5" fill="#e2e8f0" text-anchor="middle">3. Local JS Inference</text>
    <text x="80" y="133" font-family="sans-serif" font-size="9.5" fill="#e2e8f0" text-anchor="middle">4. 0ms Server Latency</text>
    
    <!-- State badges -->
    <rect x="15" y="145" width="130" height="22" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1"/>
    <text x="80" y="160" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#34d399" text-anchor="middle">LEGITIMATE (Green)</text>

    <rect x="15" y="173" width="130" height="22" rx="4" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1"/>
    <text x="80" y="188" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#f87171" text-anchor="middle">PHISHING (Red Alert)</text>
  </g>

  <!-- Bottom Legend / Note -->
  <g transform="translate(40, 390)">
    <rect width="880" height="45" rx="6" fill="#131d2e" stroke="#1e293b"/>
    <text x="440" y="27" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
      100% On-Device Client Inference • Sub-millisecond Execution Latency • Zero External Data Tracking • Full Python/JS Parity
    </text>
  </g>
</svg>
